<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HERMES Cyber Core MiniApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07070a;--card:#0f0f18;--border:#1a1a2e;--cyan:#00f3ff;--purple:#9d4edd;--green:#00ff88;--red:#ff0055;--text:#e2e8f0}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px;font-size:12px;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding:12px}
.glass{background:rgba(15,15,24,.85);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;backdrop-filter:blur(12px)}
.hdr{display:flex;justify-content:space-between;align-items:center}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);display:inline-block;margin-left:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse.offline{background:var(--red);box-shadow:0 0 10px var(--red)}
.title{font-weight:900;background:linear-gradient(to left,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Tabs Nav */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tab-btn{padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:#888;font-weight:700;cursor:pointer;text-align:center;font-size:11px;transition:all .2s}
.tab-btn.active{background:rgba(0,243,255,.1);border-color:var(--cyan);color:var(--cyan)}
.page{display:none}.page.active{display:block}

/* System Stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stat-card{background:#0a0a12;padding:8px;border-radius:10px;border:1px solid var(--border)}
.bar-bg{width:100%;height:4px;background:#18182a;border-radius:2px;margin-top:4px;overflow:hidden}
.bar-fill{height:100%;width:0%;background:var(--cyan);transition:width .4s}

/* Forms & Inputs */
.inp{width:100%;padding:10px;background:#090910;border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:8px;font-family:'Vazirmatn';font-size:11px;outline:none}
.inp:focus{border-color:var(--cyan)}
.btn{width:100%;padding:10px;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-family:'Vazirmatn';font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),#0088aa);color:#000}
.btn-red{background:rgba(255,0,85,.2);color:var(--red);border:1px solid var(--red)}

/* Cron Item */
.cron-card{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#090910;border-radius:10px;border:1px solid var(--border);margin-bottom:6px}
.badge{padding:2px 6px;border-radius:4px;font-size:8px;font-weight:700}
.badge-active{background:rgba(0,255,136,.15);color:var(--green);border:1px solid var(--green)}
.badge-disabled{background:rgba(255,0,85,.15);color:var(--red);border:1px solid var(--red)}

/* Chat Area */
.chat-box{height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:#06060a;border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;font-size:11px;line-height:1.4}
.msg-hermes{align-self:flex-start;background:#121225;color:var(--cyan);border-bottom-right-radius:2px}
.msg-user{align-self:flex-end;background:linear-gradient(135deg,var(--purple),#5b21b6);color:#fff;border-bottom-left-radius:2px}
.msg-time{font-size:8px;opacity:.6;margin-top:2px;text-align:left}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="glass hdr">
    <div><span class="pulse" id="statusDot"></span><span class="title">HERMES CYBER GATEWAY</span></div>
    <div style="font-size:9px;color:#666" id="syncStatus">درحال اتصال...</div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('crons', this)">⚡ کرون‌جاب‌ها</div>
    <div class="tab-btn" onclick="switchTab('chat', this)">💬 مدیریت چت</div>
    <div class="tab-btn" onclick="switchTab('system', this)">📊 وضعیت سرور</div>
  </div>

  <!-- PAGE 1: CRON JOBS -->
  <div id="page-crons" class="page active">
    <div class="glass">
      <div style="font-weight:700;margin-bottom:8px;color:var(--cyan)">➕ ساخت کرون‌جاب جدید</div>
      <input type="text" id="cronName" class="inp" placeholder="نام کرون‌جاب (مثلاً: اسکن روزانه)">
      <input type="text" id="cronDesc" class="inp" placeholder="توضیحات جاب">
      <div style="display:flex;gap:6px">
        <input type="text" id="cronSchedule" class="inp" placeholder="0 6 * * *" style="direction:ltr;font-family:monospace">
        <select class="inp" style="width:110px" onchange="document.getElementById('cronSchedule').value=this.value">
          <option value="0 6 * * *">۶ صبح</option>
          <option value="0 * * * *">هر ساعت</option>
          <option value="*/15 * * * *">۱۵ دقیقه</option>
        </select>
      </div>
      <button class="btn btn-cyan" onclick="addCron()">⚡ ثبت و ارسال زنده به هرمس</button>
    </div>
    <div class="glass">
      <div style="font-weight:700;margin-bottom:8px">📋 لیست جاب‌های فعال و زمان‌بندی‌ها</div>
      <div id="cronContainer">در حال بارگذاری...</div>
    </div>
  </div>

  <!-- PAGE 2: CHAT MANAGEMENT -->
  <div id="page-chat" class="page">
    <div class="glass">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:700;color:var(--purple)">💬 چت زنده با هرمس</span>
        <button onclick="clearChat()" style="background:none;border:none;color:var(--red);font-size:10px;cursor:pointer">🧹 پاک‌سازی</button>
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div style="display:flex;gap:6px">
        <input type="text" id="chatInput" class="inp" placeholder="پیام خود را بنویسید..." style="margin-bottom:0" onkeypress="if(event.key==='Enter')sendChat()">
        <button class="btn btn-cyan" style="width:70px" onclick="sendChat()">ارسال</button>
      </div>
    </div>
  </div>

  <!-- PAGE 3: SYSTEM MONITORING -->
  <div id="page-system" class="page">
    <div class="glass">
      <div style="font-weight:700;margin-bottom:10px">📊 پایش زنده منابع Gateway</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div>CPU</div><div style="font-weight:900;color:var(--cyan)" id="cpuVal">0%</div>
          <div class="bar-bg"><div id="cpuBar" class="bar-fill"></div></div>
        </div>
        <div class="stat-card">
          <div>RAM</div><div style="font-weight:900;color:var(--green)" id="ramVal">0%</div>
          <div class="bar-bg"><div id="ramBar" class="bar-fill" style="background:var(--green)"></div></div>
        </div>
        <div class="stat-card">
          <div>DISK</div><div style="font-weight:900;color:var(--purple)" id="diskVal">0%</div>
          <div class="bar-bg"><div id="diskBar" class="bar-fill" style="background:var(--purple)"></div></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const GATEWAY = "https://permission-everyday-reserves-mouse.trycloudflare.com";

var tg = window.Telegram && window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();}

function switchTab(tab, el){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('page-'+tab).classList.add('active');
  el.classList.add('active');
}

async function fetchCrons(){
  try{
    const res = await fetch(GATEWAY + '/api/v1/cron/list');
    const data = await res.json();
    const c = document.getElementById('cronContainer');
    c.innerHTML = '';
    if(data.crons.length === 0){
      c.innerHTML = '<div style="color:#666;text-align:center;padding:10px">هیچ کرون‌جابی ثبت نشده است.</div>';
      return;
    }
    data.crons.forEach(function(job){
      var isAct = job.status === 'active';
      var badgeClass = isAct ? 'badge-active' : 'badge-disabled';
      var badgeText = isAct ? 'فعال' : 'متوقف';
      var toggleBg = isAct ? 'rgba(255,0,85,.2)' : 'rgba(0,255,136,.2)';
      var toggleColor = isAct ? 'var(--red)' : 'var(--green)';
      var toggleText = isAct ? 'توقف' : 'فعال‌سازی';
      c.innerHTML += '<div class="cron-card"><div><div style="font-weight:700">' + job.name + ' <span class="badge ' + badgeClass + '">' + badgeText + '</span></div><div style="font-size:9px;color:#888;margin-top:2px">' + job.description + '</div><div style="font-size:9px;color:var(--cyan);font-family:monospace;direction:ltr;text-align:right;margin-top:2px">' + job.schedule + '</div></div><div style="display:flex;gap:4px"><button class="btn" style="width:auto;padding:4px 8px;font-size:9px;background:' + toggleBg + ';color:' + toggleColor + '" onclick="toggleCron(\'' + job.name + '\',\'toggle\')">' + toggleText + '</button><button class="btn btn-red" style="width:auto;padding:4px 8px;font-size:9px" onclick="toggleCron(\'' + job.name + '\',\'delete\')">حذف</button></div></div>';
    });
  }catch(e){}
}

async function addCron(){
  var name = document.getElementById('cronName').value;
  var description = document.getElementById('cronDesc').value;
  var schedule = document.getElementById('cronSchedule').value;
  if(!name || !schedule) return alert('نام و زمان‌بندی الزامی است.');
  await fetch(GATEWAY + '/api/v1/cron/add', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: name, description: description, schedule: schedule, command: ''})
  });
  document.getElementById('cronName').value = '';
  document.getElementById('cronDesc').value = '';
  fetchCrons();
}

async function toggleCron(name, action){
  await fetch(GATEWAY + '/api/v1/cron/toggle', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: name, action: action})
  });
  fetchCrons();
}

async function fetchChats(){
  try{
    var res = await fetch(GATEWAY + '/api/v1/chat/messages');
    var data = await res.json();
    var box = document.getElementById('chatBox');
    box.innerHTML = '';
    data.messages.forEach(function(m){
      var isH = m.sender === 'hermes';
      var cls = isH ? 'msg-hermes' : 'msg-user';
      box.innerHTML += '<div class="msg ' + cls + '"><div>' + m.text + '</div><div class="msg-time">' + m.time + '</div></div>';
    });
    box.scrollTop = box.scrollHeight;
  }catch(e){}
}

async function sendChat(){
  var inp = document.getElementById('chatInput');
  if(!inp.value.trim()) return;
  var text = inp.value;
  inp.value = '';
  await fetch(GATEWAY + '/api/v1/chat/send', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sender: 'user', text: text})
  });
  fetchChats();
}

async function clearChat(){
  await fetch(GATEWAY + '/api/v1/chat/clear', {method: 'POST'});
  fetchChats();
}

async function fetchStats(){
  try{
    var res = await fetch(GATEWAY + '/api/v1/stats');
    var d = await res.json();
    document.getElementById('cpuVal').textContent = d.cpu + '%';
    document.getElementById('cpuBar').style.width = d.cpu + '%';
    document.getElementById('ramVal').textContent = d.ram + '%';
    document.getElementById('ramBar').style.width = d.ram + '%';
    document.getElementById('diskVal').textContent = d.disk + '%';
    document.getElementById('diskBar').style.width = d.disk + '%';
    document.getElementById('syncStatus').textContent = '🟢 زنده (LIVE)';
    document.getElementById('syncStatus').style.color = 'var(--green)';
    document.getElementById('statusDot').className = 'pulse';
  }catch(e){
    document.getElementById('syncStatus').textContent = '🔴 قطع ارتباط';
    document.getElementById('syncStatus').style.color = 'var(--red)';
    document.getElementById('statusDot').className = 'pulse offline';
  }
}

setInterval(fetchStats, 4000);
setInterval(fetchCrons, 6000);
setInterval(fetchChats, 3000);
fetchStats();
fetchCrons();
fetchChats();
</script>
</body>
</html>
